# athena's 4.19 kernel has pidfd_open (Android backport) but not
# waitid(P_PIDFD) (5.4+); glib >= 2.76 then fails every child reap and every
# app install ends in "Failed to extract package". See athena-extras/nopidfd.c;
# the proper fix is the kernel backport of "signal: support pidfd in waitid".
[Service]
Environment=LD_PRELOAD=/usr/lib/athena/libnopidfd.so
