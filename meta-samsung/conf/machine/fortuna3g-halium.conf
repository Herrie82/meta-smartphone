#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: Samsung Galaxy Grand Prime (SM-G530H, codename fortuna3g), Halium
#@DESCRIPTION: Machine configuration for the Samsung Galaxy Grand Prime 3G on
#              Halium: the 3.10 vendor kernel, the 16.0 GSI in an Android
#              container, 32-bit
#-----------------------------------------------------------------------------

# The same SoC (MSM8916), kernel generation (3.10) and arrangement as a3-2015-halium, from which
# this machine is copied. The phone never had a Treble vendor: it shipped with Android 5.1, and its
# LineageOS 18.1 build puts the vendor under /system/vendor. So, as on the A3, a vendor image is
# derived from that build (classes/halium-legacy-vendor.bbclass) and paired with the plain 32-bit GSI.
#
# Everything here is read from the LineageOS 18.1 trees for the phone, the fortuna-for-smoothie forks
# of Gabboxl's and Galaxy-MSM8916's work (github.com/fortuna-for-smoothie:
# android_device_samsung_fortuna3g, android_device_samsung_gprimelte-common,
# android_device_samsung_msm8916-common and proprietary_vendor_samsung, branch lineage-18.1, the blobs
# lineage-18.1exp), and from the kernel (shr-distribution/linux fortuna3g/3.10/lineage-19.1).
# Nothing has been read off a phone yet.

require conf/machine/include/meta-android-halium.inc

# 32-bit kernel and userland. The MSM8916 has Cortex-A53 cores, but the LineageOS build is armeabi-v7a
# only (FORCE_32_BIT := true in msm8916-common's BoardConfigCommon.mk) and its kernel is an arch/arm
# one, so the vendor is 32-bit and pairs with the halium_arm GSI.
TARGET_ARCH = "arm"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-samsung-fortuna3g-halium"
MACHINE_KERNEL_PR = "r0"

# The hardware the LineageOS build drives: Qualcomm WCNSS Wi-Fi and Bluetooth, a dual-SIM Samsung
# modem (SIM_COUNT 2, libsec-ril-dsds), GPS, and a rear and a front camera (camera.vendor.msm8916.so).
# No NFC: the kernel config has the QNCI driver, but no fortuna3g tree builds an NFC HAL and the
# SM-G530H has no NFC antenna.
MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 touchscreen"
MACHINE_FEATURES += "camera-rear camera-front"

# FM receiver: Qualcomm radio-iris (CONFIG_RADIO_IRIS=y in msm8916_sec_defconfig; msm8916-common builds
# qcom.fmradio and FMRadio), as on a3-2015-halium. Declared from the kernel config; not yet tried.
MACHINE_FEATURES += "fm-radio"

# 5" 540x960 TFT (HX8389C or S6D78A0 panel, both 62 x 110 mm in the device tree): 222 ppi.
MACHINE_DISPLAY_WIDTH_PIXELS = "540"
MACHINE_DISPLAY_HEIGHT_PIXELS = "960"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "222"

# The vendor is the one built from LineageOS 18.1 (Android 11, VNDK 30), made Treble-shaped by
# classes/halium-legacy-vendor.bbclass, and paired with the 16.0 GSI, as on a3-2015-halium.
PREFERRED_VERSION_android-headers-halium = "16.0%"
VIRTUAL-RUNTIME_android-system-image = "android-system-image-fortuna3g-halium"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

# msm8916_sec_defconfig has CONFIG_MODULES but sets no option to m: everything, the Wi-Fi driver
# too (PRONTO_WLAN=y), is built in.
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

KERNEL_IMAGETYPE = "zImage"

# Installed from TWRP, as a rootfs tarball, like the other Halium phones.
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

# msm8916-common's fstab.qcom names the partitions under /dev/block/bootdevice/by-name; the eMMC is
# 7824900.sdhci (androidboot.bootdevice). The boot partition is 13 MiB (BOARD_BOOTIMAGE_PARTITION_SIZE).
# Unlike a3-2015-halium there is no lk2nd in front: the boot image (with its QCDT table) goes straight
# to the boot partition, as the LineageOS build writes it.
ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/bootdevice/by-name/boot"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "4096"

# The kernel is 3.10, whose ext4 knows none of 64bit, metadata_csum, metadata_csum_seed or
# orphan_file, which a current mke2fs enables by default.
EXTRA_IMAGECMD:ext4:forcevariable = "-i 4096 -O ^64bit,^metadata_csum,^metadata_csum_seed,^orphan_file"

# The LineageOS command line has console=null; msm_serial_hs's ttyHSL0 is the MSM8916 debug UART.
# TODO(verify): that it is reachable on this phone.
SERIAL_CONSOLE = "115200 ttyHSL0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# v4l2loopback: kernel half of droidcam2v4l2 (as on a3-2015-halium; the kernel branch carries the
# same v4l2 forward-port).
MACHINE_EXTRA_RDEPENDS += "v4l2loopback"
