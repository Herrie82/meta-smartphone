# LuneOS/Halium config delta - Samsung Galaxy Grand Prime 3G (SM-G530H, fortuna3g, MSM8916).
#
# Merged on top of msm8916_sec_defconfig + msm8916_sec_fortuna3g_eur_defconfig + selinux_defconfig
# from shr-distribution/linux fortuna3g/3.10/lineage-19.1 (Gabboxl's lineage-19.1, 3.10.108), the
# configuration the LineageOS build of the phone uses. It is an Android config, so it lacks what a
# systemd userspace and the LXC container assume. The same delta as a3-2015-halium's, without its
# lk2nd ramoops bring-up block.
#
# First pass: merged and built, NOT booted. Re-check the built .config.
#
# NOTE: do NOT write bare "# CONFIG_FOO=y" in comments in this file. kconfig reads such a line as a
# directive. Reference symbols without the CONFIG_ prefix in prose.

# ---------------------------------------------------------------------------
# Deliberately OFF (the same choices as sm-t520's luneos.cfg, which explains them)
# ---------------------------------------------------------------------------
# No System V IPC and so no IPC namespace; LXC keeps the host's IPC and user namespaces.
# CONFIG_SYSVIPC is not set
# CONFIG_USER_NS is not set
# Real-time group scheduling: with it a task in a non-root cgroup gets no RT runtime, and the
# container's composer cannot make itself SCHED_FIFO.
# CONFIG_RT_GROUP_SCHED is not set
# Android's paranoid network check limits sockets to the AID_INET group, which the glibc userspace's
# services do not carry.
# CONFIG_ANDROID_PARANOID_NETWORK is not set

# ---------------------------------------------------------------------------
# What Halium needs and the defconfig lacks
# ---------------------------------------------------------------------------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_FHANDLE=y
CONFIG_VT=y

# systemd and Android's libprocessgroup
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_BLK_CGROUP=y
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_EXT4_FS_POSIX_ACL=y

# Hotplug events go to udev, not to /sbin/hotplug.
CONFIG_UEVENT_HELPER_PATH=""

# With ANDROID_PARANOID_NETWORK off, members of net_raw and net_admin no longer get CAP_NET_RAW and
# CAP_NET_ADMIN, which vendor daemons such as rmt_storage depend on. Halium's
# SECURITY_ANDROID_GID_CAPABILITIES (commit 51cdcf5fafd3 on the kernel branch) keeps that grant
# without the socket restriction, as on bullhead-halium.
CONFIG_SECURITY_ANDROID_GID_CAPABILITIES=y

# What bullhead-halium's kernel (also MSM 3.10) added from other Halium ports of its phone: kcmp() and
# the other interfaces systemd's README asks for, fanotify, and the optional systemd cgroup
# controllers.
CONFIG_CHECKPOINT_RESTORE=y
CONFIG_FANOTIFY=y
CONFIG_CGROUP_PERF=y
CONFIG_NET_CLS_CGROUP=y

# /proc/config.gz, to compare a running kernel against this file.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# What sm-t520's fragment adds for the container and the distribution, from a diff against the working
# hammerhead and mako Halium kernels: a private devpts, the lxcbr0 bridge, netd's uid match, AIO and the
# process event connector.
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_BRIDGE=y
CONFIG_NETFILTER_XT_MATCH_OWNER=y
CONFIG_AIO=y
CONFIG_PROC_EVENTS=y

# bluebinder feeds the Android BT HAL into a virtual HCI, so vhci is its kernel prerequisite (as on
# sm-t520); without it bluebinder exits with "No such device". It and connman also use /dev/rfkill.
CONFIG_BT_HCIVHCI=y
CONFIG_RFKILL=y

# The BlueZ profiles the defconfig leaves out (it relies on Android's userspace stack): RFCOMM for
# serial and dial-up profiles, BNEP for PAN tethering, HIDP for keyboards and mice. As bullhead-halium's
# kernel (shr-distribution/linux cb2af939c640).
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_HIDP=y

# No legacy BSD ptys: with them the kernel registers 512 pty/tty[p-z] devices that nothing opens
# (everything allocates through /dev/ptmx and devpts), and systemd turns each into a device unit that
# every coldplug, the host's and the container ueventd's, processes again. Dropping them saved about
# 6 s of PID 1 CPU per boot on tenderloin-halium (shr-distribution/linux b7f58e22e01e).
# CONFIG_LEGACY_PTYS is not set

# Options the A3's kernel (a3-2015-halium, the same SoC, with which the 16.0 GSI runs) has on and this
# defconfig leaves off, from a diff of the two resolved configurations limited to what concerns the
# userspace and the container rather than hardware: dm-verity, which apexd can use for APEX payloads,
# squashfs, Android's persistent log channel (pmsg), the REJECT --reject-with skerr and TTL targets
# Android netd's rules use, and USB HID devices over OTG.
CONFIG_DM_VERITY=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_PSTORE_PMSG=y
CONFIG_IP_NF_TARGET_REJECT_SKERR=y
CONFIG_IP6_NF_TARGET_REJECT_SKERR=y
CONFIG_IP_NF_TARGET_TTL=y
CONFIG_USB_HIDDEV=y

# The debug cgroup controller is attached to every cgroup systemd creates; tenderloin-halium dropped it with
# the other runtime debug options (shr-distribution/linux efcd9ed977c1).
# CONFIG_CGROUP_DEBUG is not set
