#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: GreenTouch MindPhone (codename MindPhone)
#@DESCRIPTION: Machine configuration for the GreenTouch MindPhone
#-----------------------------------------------------------------------------

require conf/machine/include/arm/arch-arm64.inc
require conf/machine/include/meta-android-halium.inc

PREFERRED_PROVIDER_virtual/kernel ?= "linux-greentouch-mindphone"
MACHINE_KERNEL_PR = "r0"

MACHINE_FEATURES = "apm alsa bluetooth gps usbgadget usbhost phone wifi vfat ext2 keyboard nfc"

# Android 11, so the "modern" droid modules rather than the jb2q ones the
# halium include defaults to.

# We need fsck.vfat for vfat partitions we need to mount
# Also, include the wlan module for the kernel
MACHINE_EXTRA_RDEPENDS = " \
    android-kernel-bootimg \
    dosfstools \
"

#kernel-module-wlan

KERNEL_IMAGETYPE = "Image.gz-dtb"

ANDROID_BOARD_BOOTIMAGE_PARTITION = "/dev/block/mmcblk0p25"
ANDROID_BOARD_FLASH_BLOCK_SIZE = "131072"

SERIAL_CONSOLE = "115200 ttyHSL0"

# Boot-image-only. mindphone supplies a kernel, an initramfs and a boot image;
# the rootfs is the generic one from MACHINE=halium-arm64.
#
# This file predates the GSI work, so it still declared everything a
# self-contained port needed: its own android-system-image, an X server, display
# geometry, headers and pulseaudio versions, rootfs sizing. All of that is now
# either supplied by halium-arm64 or derived at runtime by luneos-device-config,
# and none of it is read on the boot-image path.
#
# GSI: the vendor here is Android 11, so it needs VNDK 30. Our 14.0 GSI ships
# 30/32/34 and is the newest that will serve it - the 16.0 GSI ships only 32/34
# because that tree syncs prebuilts/vndk v31-v34 and cannot supply 30 at all.
LUNEOS_BOOTIMAGE_ONLY = "1"
