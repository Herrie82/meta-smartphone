#-----------------------------------------------------------------------------
#@TYPE: Machine
#@NAME: HP Touchpad Go (codename shortloin/opal)
#@DESCRIPTION: Machine configuration for the HP Touchpad Go - Mainline Kernel
#-----------------------------------------------------------------------------

TARGET_ARCH = "arm"

# tenderloin3g is the 3G/cellular variant of the same HP TouchPad hardware
# as `tenderloin`; the eMMC partition layout, A6 controllers, WiFi/BT chips,
# audio codec, panel and initramfs flow are identical. Inherit the
# `tenderloin` override so all the meta-hp bbappends keyed on
# `:tenderloin` (initramfs-scripts-simple, firmware bundling, etc.) also
# apply here -- otherwise the 3G initramfs ships without S01-mount-boot.sh
# and LVM is never activated, so /dev/store/luneos-root never appears.
MACHINEOVERRIDES =. "tenderloin:"

PREFERRED_PROVIDER_virtual/kernel = "linux-hp-shortloin"
MACHINE_KERNEL_PR = "r0"

MACHINE_FEATURES = "kernel26 apm alsa bluetooth gps usbgadget usbhost wifi vfat ext2 keyboard"

MACHINE_DISPLAY_WIDTH_PIXELS = "1024"
MACHINE_DISPLAY_HEIGHT_PIXELS = "768"
MACHINE_DISPLAY_ORIENTATION = "0"
MACHINE_DISPLAY_PPI = "132"

PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgbm ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"
PREFERRED_PROVIDER_virtual/mesa ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_libgbm ?= "mesa"

PREFERRED_PROVIDER_virtual/xserver = "xserver-xorg"
XSERVER = " \
    xserver-xorg \
    xf86-input-evdev \
    xf86-video-fbdev \
"

MACHINE_EXTRA_RDEPENDS = " \
    linux-firmware-ath6k \
    firmware-hp-tenderloin \
    kernel-modules \
    lvm2 \
"

KERNEL_DEVICETREE = "qcom/qcom-apq8060-opal.dtb"
KERNEL_IMAGETYPE = "zImage"
IMAGE_FSTYPES += "tar.gz"
IMAGE_ROOTFS_EXTRA_SPACE = "200000"

UBOOT_ENTRYPOINT = "${UBOOT_LOADADDRESS}"
UBOOT_LOADADDRESS = "0x40208000"

SERIAL_CONSOLE = "115200 ttyMSM0"

require conf/machine/include/arm/armv7a/tune-cortexa8.inc
